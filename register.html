<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sun son Solar - Registration</title>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <div class="container">

        <div class="logo">
            <h1>Sun son Solar</h1>
            <p>Solar Solutions and Services</p>
        </div>

        <div class="form-title">
            <h2>Create an Account</h2>
            <p>Join us and take the first step toward a brighter energy future.</p>
        </div>

        <form action="register.php" method="POST">

            <div class="row">

                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name">
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name">
                </div>

            </div>

            <div class="form-group">
                <label for="middle_name">Middle Name</label>
                <input type="text" id="middle_name" name="middle_name">
            </div>

            <div class="row">

                <div class="form-group">
                    <label for="birthdate">Birthdate</label>
                    <input type="date" id="birthdate" name="birthdate">
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select id="gender" name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>

                </div>

            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="text" id="phone_number" name="phone_number">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username">
            </div>

            <div class="row">

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password">
                </div>

            </div>

            <div class="form-group">
                <label for="user_type">User Type</label>

                <select id="user_type" name="user_type">
                    <option value="">Select User Type</option>
                    <option value="Customer">Customer</option>
                    <option value="Employee">Employee</option>
                </select>

            </div>

            <div class="form-group" id="department_group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="Enter department">
            </div>

            <div id="message" class="message"></div>

          <button type="submit">Register</button>

        </form>

    </div>

    <script src="script.js?v=4"></script>

</body>

</html>
